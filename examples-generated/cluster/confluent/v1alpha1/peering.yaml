apiVersion: confluent.confluent.crossplane.io/v1alpha1
kind: Peering
metadata:
  annotations:
    meta.upbound.io/example-id: confluent/v1alpha1/peering
  labels:
    testing.upbound.io/example-name: aws
  name: aws
spec:
  forProvider:
    aws:
    - account: "012345678901"
      customerRegion: us-east-2
      routes:
      - 172.31.0.0/16
      vpc: vpc-abcdef0123456789a
    displayName: AWS Peering
    environment:
    - id: ${confluent_environment.development.id}
    network:
    - id: ${confluent_network.aws-peering.id}

---

apiVersion: environment.confluent.crossplane.io/v1alpha1
kind: Environment
metadata:
  annotations:
    meta.upbound.io/example-id: confluent/v1alpha1/peering
  labels:
    testing.upbound.io/example-name: development
  name: development
spec:
  forProvider:
    displayName: Development

---

apiVersion: confluent.confluent.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: confluent/v1alpha1/peering
  labels:
    testing.upbound.io/example-name: aws-peering
  name: aws-peering
spec:
  forProvider:
    cidr: 10.10.0.0/16
    cloud: AWS
    connectionTypes:
    - PEERING
    displayName: AWS Peering Network
    environment:
    - id: ${confluent_environment.development.id}
    region: us-east-2

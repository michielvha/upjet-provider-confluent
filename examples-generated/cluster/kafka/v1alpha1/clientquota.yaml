apiVersion: kafka.confluent.crossplane.io/v1alpha1
kind: ClientQuota
metadata:
  annotations:
    meta.upbound.io/example-id: kafka/v1alpha1/clientquota
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    description: Test Quota
    displayName: test-quota
    environment:
    - id: ${confluent_environment.development.id}
    kafkaCluster:
    - idSelector:
        matchLabels:
          testing.upbound.io/example-name: dedicated
    principals:
    - ${confluent_service_account.app_manager.id}
    - ${confluent_service_account.app_manager_2.id}
    throughput:
    - egressByteRate: "200"
      ingressByteRate: "100"

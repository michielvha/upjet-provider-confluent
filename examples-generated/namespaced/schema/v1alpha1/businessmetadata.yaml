apiVersion: schema.confluent.m.crossplane.io/v1alpha1
kind: BusinessMetadata
metadata:
  annotations:
    meta.upbound.io/example-id: schema/v1alpha1/businessmetadata
  labels:
    testing.upbound.io/example-name: pii
  name: pii
  namespace: crossplane-system
spec:
  forProvider:
    attributeDefinition:
    - name: team
    - name: email
    credentials:
    - keySecretRef:
        key: example-key
        name: example-secret
      secretSecretRef:
        key: example-key
        name: example-secret
